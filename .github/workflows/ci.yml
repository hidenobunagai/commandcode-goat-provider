name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with the local toolchain: bun.lock is lockfileVersion 1
          # today (1.4.0 preserves it), but a regenerated lock is version 2 and
          # 1.3.8 cannot read that -- with --frozen-lockfile it dies with
          # "Unknown lockfile version", without it bun warns "Ignoring
          # lockfile" and quietly re-resolves from package.json instead.
          bun-version: 1.4.0
      - run: bun install --ignore-scripts
      - name: Supply chain scan (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.0
        with:
          scan-args: |-
            --lockfile bun.lock
      - run: bun run lint
      - run: bun run compile
      - run: bun run test -- --runInBand --coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
      - run: bun run package:vsix

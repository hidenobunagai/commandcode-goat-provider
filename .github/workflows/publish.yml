name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --ignore-scripts
      - run: bun run lint
      - run: bun run compile
      - run: bun run test -- --runInBand
      - run: bun run package:vsix
      - name: Publish to VS Code Marketplace
        run: bunx vsce publish --no-dependencies --allow-missing-repository -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

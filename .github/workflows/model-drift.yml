# Daily second check: does the bundled catalog still match the live Command Code API?
#
# The authoritative daily run happens on homepi (`daily-model-watch.timer` ->
# scripts/daily-model-watch.sh -> DSH headless agent). This workflow is the
# independent CI-side check: it re-runs the same free drift detector on a clean
# runner and fails with a summary when drift appears, so drift is visible even if
# the homepi host is down. It never edits or publishes anything.
name: Model Catalog Drift

on:
  schedule:
    - cron: '37 6 * * *'        # daily 06:37 UTC, off-peak
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect drift vs live Command Code API
        run: |
          set +e
          node scripts/check-live-models.ts --json > "$RUNNER_TEMP/drift.json"
          status=$?
          set -e
          cat "$RUNNER_TEMP/drift.json"
          {
            echo '## Model catalog drift check'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/drift.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            0) echo "::notice::no catalog drift" ;;
            2)
              echo "::error::catalog drift vs live Command Code API — homepi daily-model-watch applies this; see docs/model-sync.md"
              exit 1
              ;;
            *) echo "::error::drift check failed (API unreachable or catalog unreadable)"; exit 1 ;;
          esac
